<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-practices</title>
    <style>
        body{
            height:100vh;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 1440px;
            height: 1024px;
            background-color: rgb(161, 191, 217);
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 5fr 5fr;
            gap: 1px;
        }
        .box{
            background-color: rgb(113, 110, 161);
            font-family: 'Courier New', Courier, monospace;
            font-size:30px;
        }

        @media screen and (max-width:760px) {
            .container{
            width: 760px;
            height: 1024px;
            background-color: rgb(89, 58, 121);
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 5fr 5fr;
            gap: 1px;
            }
        .box{
            background-color: rgb(92, 28, 129);
            font-family: 'Courier New', Courier, monospace;
            font-size:15px;
        }

        @media screen and (max-width:392px) {
            .container{
            width: 392px;
            height: 1024px;
            background-color: rgb(80, 28, 132);
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 5fr 5fr;
            gap: 1px;
            }
            .box{
            background-color: rgb(175, 90, 224);
            font-family: 'Courier New', Courier, monospace;
            font-size:7px;
            }
        }
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <div class="box box4">box4</div>
        <div class="box box5">box5</div>
        <div class="box box6">box6</div>
        <div class="box box7">box7</div>
        <div class="box box8">box8</div>
    </div>
</body>
</html>
