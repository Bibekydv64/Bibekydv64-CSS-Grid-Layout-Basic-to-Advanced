<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practic-layout</title>
    <style>
        .container{
            height: 1020px;
            width: 1440px;
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
        }
        .box{
            background: #3765bc;
        }
        @media screen and (max-width:1032px) {
            .container{
            width: 900px;
            height: 1032px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 2px;
            }
            .box{
            background: #7794ca;
        }
        @media screen and(max-width:292px) {
            .container{
            width: 292;
            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 2px;
            }
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <div class="box box4">box4</div>
        <div class="box box5">box5</div>
        <div class="box box6">box6</div>
        <div class="box box7">box7</div>
        <div class="box box8">box8</div>
        <div class="box box9">box9</div>
        <div class="box box10">box10</div>
        <div class="box box11">box11</div>
        <div class="box box12">box12</div>
        <div class="box box12">box13</div>
        <div class="box box12">box14</div>
        <div class="box box12">box15</div>
        <div class="box box12">box16</div>
    </div>
</body>
</html>
